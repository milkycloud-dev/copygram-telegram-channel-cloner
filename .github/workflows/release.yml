name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP: Copygram
  ENTRY: main_flet.py
  TITLE: Copygram
  PYI_FLAGS: --windowed

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-latest
            platform: Linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Syntax check
        shell: bash
        run: python -m py_compile $(git ls-files '*.py')

      - name: Build
        shell: bash
        run: |
          icon=""
          if [ "${{ matrix.platform }}" = "Windows" ] && [ -f icon.ico ]; then icon="--icon icon.ico"; fi
          pyinstaller --noconfirm --onedir $PYI_FLAGS $icon --name "$APP" "$ENTRY"

      - name: Package (Windows)
        if: matrix.platform == 'Windows'
        run: Compress-Archive -Path "dist/${{ env.APP }}" -DestinationPath "${{ env.APP }}_Windows.zip"

      - name: Package (Linux)
        if: matrix.platform == 'Linux'
        run: tar -czf "${APP}_Linux.tar.gz" -C dist "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.APP }}_${{ matrix.platform }}.*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '/^## / {p = ($2 == v); next} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $GITHUB_REF_NAME" > notes.md
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.TITLE }} ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
